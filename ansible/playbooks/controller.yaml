- name: Configure Controller Node
  hosts: controllers
  become: true
  tasks:
    - name: Create k0s configuration directory
      ansible.builtin.file:
        path: /etc/k0s
        state: directory

    - name: Configure k0s
      ansible.builtin.template:
        src: ../templates/k0s.yaml.j2
        dest: /etc/k0s/k0s.yaml

    - name: Install k0s controller
      ansible.builtin.command:
        argv:
          - k0s
          - install
          - controller
          - --enable-worker
          - --profile=phone
          - --disable-components=konnectivity-server,metrics-server,autopilot
          - "--kubelet-extra-args=--node-ip={{ node_ip }}"
          - -c
          - /etc/k0s/k0s.yaml
      when:
        - "'k0scontroller.service' not in ansible_facts.services"
        - "'k0scontroller' not in ansible_facts.services"
    
    - name: Start k0s controller
      ansible.builtin.service:
        name: k0scontroller
        state: started
        enabled: true

    - name: Create worker token
      ansible.builtin.command:
        cmd: k0s token create --role=worker --expiry=1h
      register: worker_token
      changed_when: true
      no_log: true

    - name: Store token
      ansible.builtin.set_fact:
        k0s_worker_token: "{{ worker_token.stdout }}"
      no_log: true

    - name: Read admin kubeconfig
      ansible.builtin.command: k0s kubeconfig admin
      register: k0s_admin_kubeconfig
      changed_when: false
      no_log: true

    - name: Create local kube directory
      ansible.builtin.file:
        path: "{{ local_kube_dir }}"
        state: directory
      delegate_to: localhost
      become: false
      run_once: true

    - name: Save kubeconfig locally
      ansible.builtin.copy:
        content: "{{ k0s_admin_kubeconfig.stdout }}"
        dest: "{{ local_kubeconfig }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true