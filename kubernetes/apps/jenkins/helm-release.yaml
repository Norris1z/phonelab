apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jenkins
spec:
  interval: 10m
  chart:
    spec:
      chart: jenkins
      version: 5.13.2
      sourceRef:
        kind: HelmRepository
        name: jenkins
  values:
    controller:
      admin:
        existingSecret: jenkins-admin
      additionalPlugins:
        - job-dsl:3732.v9a_c49a_61a_313
      additionalExistingSecrets:
        - name: git-credentials
          keyName: username
        - name: git-credentials
          keyName: password
        - name: registry-credentials
          keyName: username
        - name: registry-credentials
          keyName: password
        - name: deploy-ssh
          keyName: username
        - name: deploy-ssh
          keyName: private-key
      JCasC:
        configScripts:
          credentials: |
            credentials:
              system:
                domainCredentials:
                  - credentials:
                      - usernamePassword:
                          scope: GLOBAL
                          id: git-credentials
                          description: Git credentials
                          username: ${git-credentials-username}
                          password: ${git-credentials-password}
                      - usernamePassword:
                          scope: GLOBAL
                          id: registry-credentials
                          description: Registry credentials
                          username: ${registry-credentials-username}
                          password: ${registry-credentials-password}
                      - basicSSHUserPrivateKey:
                          scope: GLOBAL
                          id: deploy-ssh
                          description: Deploy SSH key
                          username: ${deploy-ssh-username}
                          privateKeySource:
                            directEntry:
                              privateKey: ${deploy-ssh-private-key}
      resources:
        limits:
          memory: "2Gi"
          cpu: "1000m"
        requests:
          memory: "500Mi"
          cpu: "500m"
      jenkinsUrl: https://jenkins.phonelab.norris1z.com
      httpRoute:
        enabled: true
        parentRefs:
          - name: traefik-gateway
            namespace: traefik
        hostnames:
          - jenkins.phonelab.norris1z.com
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    agent:
      jenkinsUrl: https://jenkins.phonelab.norris1z.com
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi
