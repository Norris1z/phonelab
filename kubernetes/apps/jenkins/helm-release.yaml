apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jenkins
spec:
  interval: 10m
  chart:
    spec:
      chart: jenkins
      version: 5.13.2
      sourceRef:
        kind: HelmRepository
        name: jenkins
  values:
    controller:
      admin:
        existingSecret: jenkins-admin
      resources:
        limits:
          memory: "2Gi"
          cpu: "1000m"
        requests:
          memory: "500Mi"
          cpu: "500m"
      jenkinsUrl: https://jenkins.phonelab.norris1z.com
      httpRoute:
        enabled: true
        parentRefs:
          - name: traefik-gateway
            namespace: traefik
        hostnames:
          - jenkins.phonelab.norris1z.com
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    agent:
      jenkinsUrl: https://jenkins.phonelab.norris1z.com
      yamlTemplate: |
        apiVersion: v1
        kind: Pod
        spec:
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
      additionalContainers:
        - sideContainerName: buildah
          image:
            repository: docker.io/norris1z/buildah
            tag: v1.45.1
          command: ["sh", "-c"]
          args: ["sleep infinity"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi