apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.10.x"
    registry: "ghcr.io/fluxcd"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
  cluster:
    type: kubernetes
    size: small
  kustomize:
    patches:
      - target:
          kind: Deployment
          name: (kustomize-controller|helm-controller)
        patch: |
          - op: replace
            path: /spec/template/spec/containers/0/resources/requests/memory
            value: 160Mi
      - target:
          kind: Deployment
          name: source-controller
        patch: |
          - op: replace
            path: /spec/template/spec/containers/0/resources/requests/memory
            value: 96Mi
  sync:
    kind: GitRepository
    interval: 10m
    url: "https://github.com/Norris1z/phonelab.git"
    ref: "refs/heads/main"
    path: "kubernetes/flux-system"