apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.10.x"
    registry: "ghcr.io/fluxcd"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
  cluster:
    type: kubernetes
    size: small
  sync:
    kind: GitRepository
    url: "https://github.com/Norris1z/phonelab.git"
    ref: "refs/heads/main"
    path: "kubernetes/flux-system"