global:
  scrape_interval: 15s

rule_files:
  - rules.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: node-exporter
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [monitoring]
        selectors:
          - role: pod
            label: app.kubernetes.io/name=node-exporter
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: instance

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      insecure_skip_verify: true
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: instance
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|cpu_cfs_periods_total|cpu_cfs_throttled_periods_total|memory_working_set_bytes|network_receive_bytes_total|network_transmit_bytes_total)
        action: keep

  - job_name: kube-state-metrics
    static_configs:
      - targets: [kube-state-metrics:8080]

  - job_name: flux
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [flux-system]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: http-prom|http-metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance
