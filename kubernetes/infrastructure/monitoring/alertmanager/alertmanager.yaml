apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true" # well, not the best but it works, if the control-plane dies then its on vibes :)
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.35.0
          args:
            - --config.file=/etc/alertmanager/config.yaml
            - --storage.path=/alertmanager
            - --cluster.listen-address=
            - --web.external-url=http://alertmanager.monitoring:9093
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: storage
              mountPath: /alertmanager
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: telegram
              mountPath: /etc/telegram
              readOnly: true
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: alertmanager
        - name: config
          configMap:
            name: alertmanager-config
        - name: telegram
          secret:
            secretName: alertmanager-telegram
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
