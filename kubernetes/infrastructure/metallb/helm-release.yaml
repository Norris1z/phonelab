apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 10m
  chart:
    spec:
      chart: metallb
      version: 0.16.2
      sourceRef:
        kind: HelmRepository
        name: metallb
  values:
    frrk8s:
      enabled: false
    controller:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 96Mi
    speaker:
      resources:
        requests:
          cpu: 25m
          memory: 48Mi
        limits:
          memory: 96Mi
