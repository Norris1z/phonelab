apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m
  chart:
    spec:
      chart: traefik
      version: 42.4.0
      sourceRef:
        kind: HelmRepository
        name: traefik
  install:
    disableWait: true
  upgrade:
    disableWait: true
    crds: CreateReplace
  values:
    global:
      checkNewVersion: false
      aliasHeadersStrategy: delete
    providers:
      kubernetesIngress:
        enabled: false
      kubernetesGateway:
        enabled: true
      kubernetesCRD:
        safeNaming: true
    ingressClass:
      enabled: false
    gateway:
      listeners:
        websecure:
          port: 8443
          protocol: HTTPS
          hostname: "*.phonelab.norris1z.com"
          namespacePolicy:
            from: All
          certificateRefs:
            - name: phonelab-wildcard-tls
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.phonelab.norris1z.com`)
        entryPoints: [websecure]
        middlewares:
          - name: dashboard-auth
        tls:
          secretName: phonelab-wildcard-tls
    service:
      annotations:
        metallb.io/loadBalancerIPs: 192.168.0.251
    resources:
      requests:
        cpu: 25m
        memory: 48Mi
      limits:
        memory: 128Mi
