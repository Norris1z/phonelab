apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m
  chart:
    spec:
      chart: traefik
      version: 42.4.0
      sourceRef:
        kind: HelmRepository
        name: traefik
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    global:
      checkNewVersion: false
    service:
      annotations:
        metallb.io/loadBalancerIPs: 192.168.0.251
    resources:
      requests:
        cpu: 25m
        memory: 48Mi
      limits:
        memory: 128Mi
