apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sealed-secrets
  namespace: kube-system
spec:
  interval: 10m
  chart:
    spec:
      chart: sealed-secrets
      version: 2.22.0
      sourceRef:
        kind: HelmRepository
        name: sealed-secrets
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: sealed-secrets-controller
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 96Mi
